<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Forgot Password - HVAC Tutorial</title>

    <link rel="stylesheet" href="../css/style.css" />

    <link rel="stylesheet" href="../css/admin.css" />
  </head>

  <body>
    <main class="admin-login-page">
      <div class="admin-login-wrapper">
        <div class="admin-login-card">
          <!-- HEADER -->
          <div class="admin-login-header">
            <div class="admin-login-icon">🔐</div>

            <span>ADMIN SECURITY</span>

            <h1>Forgot Password?</h1>

            <p>Enter your registered admin email to reset your password.</p>
          </div>

          <!-- FORM -->
          <form id="adminForgotPasswordForm">
            <div class="admin-form-group">
              <label for="adminForgotEmail"> Admin Email </label>

              <input
                type="email"
                id="adminForgotEmail"
                placeholder="Enter your admin email"
                required
              />
            </div>

            <button type="submit" class="admin-login-btn">Continue</button>
          </form>

          <!-- FOOTER -->
          <div class="admin-login-footer">
            <a href="admin-login.html"> ← Back to Admin Login </a>
          </div>
        </div>
      </div>
    </main>

    <script src="../js/admin.js"></script>
  </body>
</html>
