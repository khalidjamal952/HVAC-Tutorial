<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Login - HVAC Tutorial</title>

    <link rel="stylesheet" href="../css/style.css" />

    <link rel="stylesheet" href="../css/admin.css" />
      <link rel="icon" type="image/png" href="../assets/Hvac%20logo/hvac%20logo.png" />
  </head>

  <body>
    <!-- ADMIN LOGIN -->

    <main class="admin-login-page">
      <div class="admin-login-wrapper">
        <div class="admin-login-card">
          <div class="admin-login-header">
            <div class="admin-login-icon">🔐</div>

            <span> ADMIN PANEL </span>

            <h1>Admin Login</h1>

            <p>Login to manage HVAC Tutorial</p>
          </div>

          <form id="adminLoginForm">
            <div class="admin-form-group">
              <label for="adminEmail"> Email Address </label>

              <input
                type="email"
                id="adminEmail"
                placeholder="Enter admin email"
                required
              />
            </div>

            <div class="admin-form-group">
              <label for="adminPassword">Password</label>

              <div class="admin-password-wrapper">
                <input
                  type="password"
                  id="adminPassword"
                  placeholder="Enter admin password"
                  required
                />

                <button
                  type="button"
                  class="password-toggle"
                  id="adminLoginPasswordToggle"
                  aria-label="Show password"
                ><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
              </div>
            </div>
            <div class="admin-forgot-password">
              <a href="admin-forgot-password.html"> Forgot Password? </a>
            </div>

            <button type="submit" class="admin-login-btn">
              Login to Admin Panel
            </button>
            <div class="admin-create-account">
              <p>
                Don't have an admin account?
                <a href="admin-setup.html">Create Admin Account</a>
              </p>
            </div>
          </form>

          <div class="admin-login-footer">
            <a href="../index.html"> ← Back to Website </a>
          </div>
        </div>
      </div>
    </main>

    <script src="../js/admin.js"></script>
  </body>
</html>
