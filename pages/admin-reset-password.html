<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Admin Password - HVAC Tutorial</title>

    <link rel="stylesheet" href="../css/style.css" />

    <link rel="stylesheet" href="../css/admin.css" />
  </head>

  <body>
    <main class="admin-login-page">
      <div class="admin-login-wrapper">
        <div class="admin-login-card">
          <!-- HEADER -->
          <div class="admin-login-header">
            <div class="admin-login-icon">🔐</div>

            <span>ADMIN SECURITY</span>

            <h1>Reset Password</h1>

            <p>Create a new strong password for your admin account.</p>
          </div>

          <!-- RESET PASSWORD FORM -->
          <form id="adminResetPasswordForm">
            <!-- NEW PASSWORD -->
            <div class="admin-form-group">
              <label for="adminNewPassword"> New Password </label>

              <div class="admin-password-wrapper">
                <input
                  type="password"
                  id="adminNewPassword"
                  placeholder="Enter new password"
                  required
                />

                <button
                  type="button"
                  class="password-toggle"
                  id="adminNewPasswordToggle"
                  aria-label="Show password"
                >
                  👁️
                </button>
              </div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="admin-form-group">
              <label for="adminConfirmPassword"> Confirm Password </label>

              <div class="admin-password-wrapper">
                <input
                  type="password"
                  id="adminConfirmPassword"
                  placeholder="Confirm new password"
                  required
                />

                <button
                  type="button"
                  class="password-toggle"
                  id="adminConfirmPasswordToggle"
                  aria-label="Show password"
                >
                  👁️
                </button>
              </div>
            </div>

            <button type="submit" class="admin-login-btn">
              Reset Password
            </button>
          </form>

          <!-- FOOTER -->
          <div class="admin-login-footer">
            <a href="admin-login.html"> ← Back to Admin Login </a>
          </div>
        </div>
      </div>
    </main>

    <script src="../js/admin.js"></script>
  </body>
</html>
